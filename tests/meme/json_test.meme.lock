      "canonical_meme": "use huffcore\nuse huffjson\ntest doc_to_json_ab_exact:\n    define list t as [CodeEntry(ch=97, code=\"0\"), CodeEntry(ch=98, code=\"1\")]\n    define j: String as doc_to_json(t, \"01\", 2)\n    assert j == \"{\\\"table\\\": [{\\\"ch\\\": 97, \\\"code\\\": \\\"0\\\"}, {\\\"ch\\\": 98, \\\"code\\\": \\\"1\\\"}], \\\"bits\\\": \\\"01\\\", \\\"original_length\\\": 2}\"\ntest doc_to_json_empty:\n    define list t as empty List<CodeEntry>\n    define j: String as doc_to_json(t, \"\", 0)\n    assert j == \"{\\\"table\\\": [], \\\"bits\\\": \\\"\\\", \\\"original_length\\\": 0}\"\ntest compress_to_json_abracadabra:\n    define j: Optional<String> as compress_to_json(\"abracadabra\")\n    assert j is not nothing\n    define doc: String as value of j\n    assert doc == \"{\\\"table\\\": [{\\\"ch\\\": 97, \\\"code\\\": \\\"0\\\"}, {\\\"ch\\\": 114, \\\"code\\\": \\\"10\\\"}, {\\\"ch\\\": 98, \\\"code\\\": \\\"110\\\"}, {\\\"ch\\\": 99, \\\"code\\\": \\\"1110\\\"}, {\\\"ch\\\": 100, \\\"code\\\": \\\"1111\\\"}], \\\"bits\\\": \\\"01101001110011110110100\\\", \\\"original_length\\\": 11}\"\ntest parse_table_bits_length:\n    define list t as [CodeEntry(ch=97, code=\"0\"), CodeEntry(ch=98, code=\"1\")]\n    define j: String as doc_to_json(t, \"01\", 2)\n    create directory \"tests/tmp\"\n    define ot: Optional<List<CodeEntry>> as table_from_json(j, \"tests/tmp/json_test_tbl.tmp\")\n    assert ot is not nothing\n    define list tbl as value of ot\n    assert length of tbl == 2\n    define e1: CodeEntry as tbl[1]\n    assert e1.ch == 98\n    assert e1.code == \"1\"\n    define ob: Optional<String> as bits_from_json(j)\n    assert ob is not nothing\n    assert value of ob == \"01\"\n    define ol: Optional<Int> as length_from_json(j)\n    assert ol is not nothing\n    assert value of ol == 2\ntest parse_empty_doc:\n    define list t as empty List<CodeEntry>\n    define j: String as doc_to_json(t, \"\", 0)\n    create directory \"tests/tmp\"\n    define ot: Optional<List<CodeEntry>> as table_from_json(j, \"tests/tmp/json_test_empty.tmp\")\n    assert ot is not nothing\n    define list tbl as value of ot\n    assert length of tbl == 0\n    define ob: Optional<String> as bits_from_json(j)\n    assert ob is not nothing\n    assert value of ob == \"\"\n    define ol: Optional<Int> as length_from_json(j)\n    assert ol is not nothing\n    assert value of ol == 0\ntest json_roundtrip_samples:\n    create directory \"tests/tmp\"\n    define list samples as [\"\", \"x\", \"aaa\", \"ab\", \"abracadabra\", \"the quick brown fox jumps over the lazy dog\", \"abcdefghijklmnopqrstuvwxyz0123456789\"]\n    define n: Int as 0\n    for each s in samples:\n        define j: Optional<String> as compress_to_json(s)\n        assert j is not nothing\n        define back: Optional<String> as decompress_from_json(value of j, \"tests/tmp/json_test_rt.tmp\")\n        assert back is not nothing\n        assert value of back == s\n        add 1 to n\n    assert n == 7\ntest truncated_json_fails:\n    define j: Optional<String> as compress_to_json(\"abracadabra\")\n    assert j is not nothing\n    define doc: String as value of j\n    define cut: String as slice doc from 0 to 30\n    create directory \"tests/tmp\"\n    define back: Optional<String> as decompress_from_json(cut, \"tests/tmp/json_test_trunc.tmp\")\n    assert back is nothing\ntest garbage_json_fails:\n    create directory \"tests/tmp\"\n    define back: Optional<String> as decompress_from_json(\"not json at all\", \"tests/tmp/json_test_garbage.tmp\")\n    assert back is nothing\ntest corrupt_bits_char_fails:\n    create directory \"tests/tmp\"\n    define doc: String as \"{\\\"table\\\": [{\\\"ch\\\": 97, \\\"code\\\": \\\"0\\\"}], \\\"bits\\\": \\\"0a1\\\", \\\"original_length\\\": 2}\"\n    define back: Optional<String> as decompress_from_json(doc, \"tests/tmp/json_test_badbits.tmp\")\n    assert back is nothing\ntest unknown_byte_in_table_fails:\n    create directory \"tests/tmp\"\n    define doc: String as \"{\\\"table\\\": [{\\\"ch\\\": 200, \\\"code\\\": \\\"0\\\"}], \\\"bits\\\": \\\"00\\\", \\\"original_length\\\": 2}\"\n    define back: Optional<String> as decompress_from_json(doc, \"tests/tmp/json_test_unkbyte.tmp\")\n    assert back is nothing\ntest length_mismatch_fails:\n    create directory \"tests/tmp\"\n    define doc: String as \"{\\\"table\\\": [{\\\"ch\\\": 97, \\\"code\\\": \\\"0\\\"}], \\\"bits\\\": \\\"0\\\", \\\"original_length\\\": 5}\"\n    define back: Optional<String> as decompress_from_json(doc, \"tests/tmp/json_test_lenmis.tmp\")\n    assert back is nothing\ntest empty_bits_doc_with_table:\n    create directory \"tests/tmp\"\n    define doc: String as \"{\\\"table\\\": [{\\\"ch\\\": 97, \\\"code\\\": \\\"0\\\"}], \\\"bits\\\": \\\"\\\", \\\"original_length\\\": 0}\"\n    define back: Optional<String> as decompress_from_json(doc, \"tests/tmp/json_test_ebits.tmp\")\n    assert back is nothing\ntest decompress_prefix_conflict_doc_fails:\n    create directory \"tests/tmp\"\n    define doc: String as \"{\\\"table\\\": [{\\\"ch\\\": 97, \\\"code\\\": \\\"0\\\"}, {\\\"ch\\\": 98, \\\"code\\\": \\\"00\\\"}], \\\"bits\\\": \\\"00\\\", \\\"original_length\\\": 2}\"\n    define back: Optional<String> as decompress_from_json(doc, \"tests/tmp/json_test_prefix.tmp\")\n    assert back is nothing\ntest float_ratio_math:\n    create directory \"tests/tmp\"\n    define r: Optional<Float> as float_ratio(23, 88, \"tests/tmp/json_test_ratio.tmp\")\n    assert r is not nothing\n    define v: Float as value of r\n    assert format v with 4 decimals == \"0.2614\"\n    define z: Optional<Float> as float_ratio(0, 0, \"tests/tmp/json_test_ratio0.tmp\")\n    assert z is not nothing\n    assert format (value of z) with 4 decimals == \"0.0000\"\n    define one: Optional<Float> as float_ratio(24, 24, \"tests/tmp/json_test_ratio1.tmp\")\n    assert one is not nothing\n    assert format (value of one) with 4 decimals == \"1.0000\"\ntest float_ratio_corrupt_fails:\n    create directory \"tests/tmp\"\n    define r: Optional<Float> as ratio_from_text(\"garbage\", \"tests/tmp/json_test_badratio.tmp\")\n    assert r is nothing\n    define r2: Optional<Float> as ratio_from_text(\"{\\\"a\\\": 1}\", \"tests/tmp/json_test_badratio2.tmp\")\n    assert r2 is nothing",
