      "canonical_meme": "record CodeEntry:\n    ch: Int\n    code: String\nfunction alphabet() -> String:\n    return \"\\t\\n\\r !\\\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\\\]^_`abcdefghijklmnopqrstuvwxyz{|}~\"\nfunction byte_of_char(c: String) -> Optional<Int>:\n    define a: String as alphabet()\n    define idx: Int as index of c in a\n    if idx == -1:\n        return nothing\n    if idx == 0:\n        return optional 9\n    if idx == 1:\n        return optional 10\n    if idx == 2:\n        return optional 13\n    return optional (idx + 29)\nfunction char_of_byte(b: Int) -> Optional<String>:\n    define a: String as alphabet()\n    if b == 9:\n        return optional (char at 0 of a)\n    if b == 10:\n        return optional (char at 1 of a)\n    if b == 13:\n        return optional (char at 2 of a)\n    if b >= 32 and b <= 126:\n        return optional (char at (b - 29) of a)\n    return nothing\nfunction frequency(text: String) -> Optional<List<Int>>:\n    define freq: Map<Int, Int> as empty Map<Int, Int>\n    define i: Int as 0\n    while i < length of string text:\n        define c: String as char at i of text\n        define ob: Optional<Int> as byte_of_char(c)\n        if ob is nothing:\n            return nothing\n        define b: Int as value of ob\n        set freq[b] to freq[b] default 0 + 1\n        add 1 to i\n    define list flat as empty List<Int>\n    for each k in freq:\n        append k to flat\n        append freq[k] to flat\n    return optional flat\nfunction build_table(freq: List<Int>) -> List<CodeEntry>:\n    if length of freq == 0:\n        define list empty_table as empty List<CodeEntry>\n        return empty_table\n    define list leaves as empty List<Int>\n    define list codes as empty List<String>\n    define list nw as empty List<Int>\n    define list nc as empty List<Int>\n    define list nl as empty List<List<Int>>\n    define i: Int as 0\n    while i < length of freq:\n        define k: Int as freq[i]\n        append k to leaves\n        append \"\" to codes\n        define list li as empty List<Int>\n        append length of leaves - 1 to li\n        append freq[i + 1] to nw\n        append k to nc\n        append li to nl\n        add 2 to i\n    while length of nw > 1:\n        define ia: Int as 0\n        define j: Int as 1\n        while j < length of nw:\n            if nw[j] < nw[ia] or nw[j] == nw[ia] and nc[j] < nc[ia]:\n                set ia to j\n            add 1 to j\n        define aw: Int as nw[ia]\n        define ac: Int as nc[ia]\n        define list al as nl[ia]\n        remove item ia from nw\n        remove item ia from nc\n        remove item ia from nl\n        define ib: Int as 0\n        set j to 1\n        while j < length of nw:\n            if nw[j] < nw[ib] or nw[j] == nw[ib] and nc[j] < nc[ib]:\n                set ib to j\n            add 1 to j\n        define bw: Int as nw[ib]\n        define bc: Int as nc[ib]\n        define list bl as nl[ib]\n        remove item ib from nw\n        remove item ib from nc\n        remove item ib from nl\n        for each li in al:\n            set codes[li] to \"0\" + codes[li]\n        for each li in bl:\n            set codes[li] to \"1\" + codes[li]\n        define list merged as empty List<Int>\n        for each li in al:\n            append li to merged\n        for each li in bl:\n            append li to merged\n        define mc: Int as ac\n        if bc < ac:\n            set mc to bc\n        append aw + bw to nw\n        append mc to nc\n        append merged to nl\n    define list root_leaves as nl[0]\n    for each li in root_leaves:\n        if length of string codes[li] == 0:\n            set codes[li] to \"0\"\n    define list tch as empty List<Int>\n    define list tcode as empty List<String>\n    for each li in root_leaves:\n        append leaves[li] to tch\n        append codes[li] to tcode\n    if length of tch > 1:\n        for i from 1 to length of tch - 1:\n            define held_ch: Int as tch[i]\n            define held_code: String as tcode[i]\n            define j: Int as i - 1\n            while j >= 0:\n                define prev_ch: Int as tch[j]\n                define prev_code: String as tcode[j]\n                if length of string prev_code > length of string held_code or length of string prev_code == length of string held_code and prev_ch > held_ch:\n                    set tch[j + 1] to prev_ch\n                    set tcode[j + 1] to prev_code\n                    subtract 1 from j\n                else:\n                    break\n            set tch[j + 1] to held_ch\n            set tcode[j + 1] to held_code\n    define list table as empty List<CodeEntry>\n    for i from 0 to length of tch - 1:\n        append CodeEntry(ch=tch[i], code=tcode[i]) to table\n    return table\nfunction codes_for(text: String) -> Optional<List<CodeEntry>>:\n    define ofl: Optional<List<Int>> as frequency(text)\n    if ofl is nothing:\n        return nothing\n    define list freq as value of ofl\n    return optional build_table(freq)\nfunction encode_bits(text: String, table: List<CodeEntry>) -> Optional<String>:\n    if length of table == 1:\n        define zeros: String as \"\"\n        define n: Int as length of string text\n        define i: Int as 0\n        while i < n:\n            set zeros to zeros + \"0\"\n            add 1 to i\n        return optional zeros\n    define code_of: Map<Int, String> as empty Map<Int, String>\n    for each e in table:\n        set code_of[e.ch] to e.code\n    define bits: String as \"\"\n    define i: Int as 0\n    while i < length of string text:\n        define c: String as char at i of text\n        define ob: Optional<Int> as byte_of_char(c)\n        if ob is nothing:\n            return nothing\n        define b: Int as value of ob\n        if code_of has key b:\n            set bits to bits + code_of[b]\n        else:\n            return nothing\n        add 1 to i\n    return optional bits\nfunction decode_bits(bits: String, table: List<CodeEntry>) -> Optional<String>:\n    define code_to_ch: Map<String, Int> as empty Map<String, Int>\n    for each e in table:\n        if length of string e.code == 0:\n            return nothing\n        if code_to_ch has key e.code:\n            return nothing\n        set code_to_ch[e.code] to e.ch\n    for each e in table:\n        for each f in table:\n            if length of string f.code > length of string e.code:\n                define head: String as slice f.code from 0 to length of string e.code\n                if head == e.code:\n                    return nothing\n    define out: String as \"\"\n    define acc: String as \"\"\n    define i: Int as 0\n    while i < length of string bits:\n        define c: String as char at i of bits\n        if c != \"0\" and c != \"1\":\n            return nothing\n        set acc to acc + c\n        if code_to_ch has key acc:\n            define b: Int as code_to_ch[acc]\n            define oc: Optional<String> as char_of_byte(b)\n            if oc is nothing:\n                return nothing\n            set out to out + value of oc\n            set acc to \"\"\n        add 1 to i\n    if length of string acc > 0:\n        return nothing\n    return optional out\nfunction bits_for(text: String) -> Optional<String>:\n    define got: Optional<List<CodeEntry>> as codes_for(text)\n    if got is nothing:\n        return nothing\n    define list t as value of got\n    return encode_bits(text, t)",
