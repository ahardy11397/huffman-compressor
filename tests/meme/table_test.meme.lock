      "canonical_meme": "use ../../huffcore\ntest abracadabra_table_exact:\n    define got: Optional<List<CodeEntry>> as codes_for(\"abracadabra\")\n    assert got is not nothing\n    define list t as value of got\n    assert length of t == 5\n    define e0: CodeEntry as t[0]\n    assert e0.ch == 97\n    assert e0.code == \"0\"\n    define e1: CodeEntry as t[1]\n    assert e1.ch == 114\n    assert e1.code == \"10\"\n    define e2: CodeEntry as t[2]\n    assert e2.ch == 98\n    assert e2.code == \"110\"\n    define e3: CodeEntry as t[3]\n    assert e3.ch == 99\n    assert e3.code == \"1110\"\n    define e4: CodeEntry as t[4]\n    assert e4.ch == 100\n    assert e4.code == \"1111\"\ntest abracadabra_bits_exact:\n    define b: Optional<String> as bits_for(\"abracadabra\")\n    assert b is not nothing\n    define bits: String as value of b\n    assert bits == \"01101001110011110110100\"\ntest aaa_single_code_zero:\n    define got: Optional<List<CodeEntry>> as codes_for(\"aaa\")\n    assert got is not nothing\n    define list t as value of got\n    assert length of t == 1\n    define e: CodeEntry as t[0]\n    assert e.ch == 97\n    assert e.code == \"0\"\n    define b: Optional<String> as bits_for(\"aaa\")\n    assert b is not nothing\n    assert value of b == \"000\"\ntest empty_text:\n    define got: Optional<List<CodeEntry>> as codes_for(\"\")\n    assert got is not nothing\n    define list t as value of got\n    assert length of t == 0\n    define b: Optional<String> as bits_for(\"\")\n    assert b is not nothing\n    assert value of b == \"\"\n    define d: Optional<String> as decode_bits(\"\", t)\n    assert d is not nothing\n    assert value of d == \"\"\ntest ab_table_and_bits:\n    define got: Optional<List<CodeEntry>> as codes_for(\"ab\")\n    assert got is not nothing\n    define list t as value of got\n    assert length of t == 2\n    define e0: CodeEntry as t[0]\n    assert e0.ch == 97\n    assert e0.code == \"0\"\n    define e1: CodeEntry as t[1]\n    assert e1.ch == 98\n    assert e1.code == \"1\"\n    define b: Optional<String> as bits_for(\"ab\")\n    assert b is not nothing\n    assert value of b == \"01\"\ntest single_char_x:\n    define got: Optional<List<CodeEntry>> as codes_for(\"x\")\n    assert got is not nothing\n    define list t as value of got\n    assert length of t == 1\n    define e: CodeEntry as t[0]\n    assert e.ch == 120\n    assert e.code == \"0\"\n    define b: Optional<String> as bits_for(\"x\")\n    assert b is not nothing\n    assert value of b == \"0\"\ntest roundtrip_samples:\n    define list samples as [\"\", \"x\", \"aaa\", \"ab\", \"abracadabra\", \"the quick brown fox jumps over the lazy dog\", \"abcdefghijklmnopqrstuvwxyz0123456789\"]\n    for each s in samples:\n        define got: Optional<List<CodeEntry>> as codes_for(s)\n        assert got is not nothing\n        define list t as value of got\n        define b: Optional<String> as encode_bits(s, t)\n        assert b is not nothing\n        define bits: String as value of b\n        define d: Optional<String> as decode_bits(bits, t)\n        assert d is not nothing\n        assert value of d == s\ntest pangram_canonical_order:\n    define got: Optional<List<CodeEntry>> as codes_for(\"the quick brown fox jumps over the lazy dog\")\n    assert got is not nothing\n    define list t as value of got\n    assert length of t == 27\n    define e0: CodeEntry as t[0]\n    assert e0.ch == 32\n    assert e0.code == \"110\"\n    define e1: CodeEntry as t[1]\n    assert e1.ch == 111\n    assert e1.code == \"001\"\n    for i from 1 to length of t - 1:\n        define prev: CodeEntry as t[i - 1]\n        define cur: CodeEntry as t[i]\n        assert length of string prev.code < length of string cur.code or length of string prev.code == length of string cur.code and prev.ch < cur.ch\ntest pangram_bits_exact:\n    define b: Optional<String> as bits_for(\"the quick brown fox jumps over the lazy dog\")\n    assert b is not nothing\n    assert value of b == \"011011101101011000011011111110010111011111011010110101000011000000001110111000001100011101111010111000000001001010110001010111010010011001101110110101101111111011001001110010110101111001111001\"\ntest digits_table_and_bits:\n    define got: Optional<List<CodeEntry>> as codes_for(\"abcdefghijklmnopqrstuvwxyz0123456789\")\n    assert got is not nothing\n    define list t as value of got\n    assert length of t == 36\n    define e0: CodeEntry as t[0]\n    assert e0.ch == 56\n    assert e0.code == \"00000\"\n    define elast: CodeEntry as t[length of t - 1]\n    assert elast.ch == 55\n    assert elast.code == \"111111\"\n    for i from 1 to length of t - 1:\n        define prev: CodeEntry as t[i - 1]\n        define cur: CodeEntry as t[i]\n        assert length of string prev.code < length of string cur.code or length of string prev.code == length of string cur.code and prev.ch < cur.ch\n    define b: Optional<String> as bits_for(\"abcdefghijklmnopqrstuvwxyz0123456789\")\n    assert b is not nothing\n    assert value of b == \"00010000110010000101001100011101000010010101001011011000110101110011111000010001100101001110100101011011010111110001100111010110111110001110011110101110111111001111011111101111110000000001\"\ntest decode_truncated_bits_fails:\n    define list tbl as [CodeEntry(ch=97, code=\"00\"), CodeEntry(ch=98, code=\"11\")]\n    define r: Optional<String> as decode_bits(\"0\", tbl)\n    assert r is nothing\ntest decode_bad_bit_char_fails:\n    define list tbl as [CodeEntry(ch=97, code=\"00\"), CodeEntry(ch=98, code=\"11\")]\n    define r: Optional<String> as decode_bits(\"02\", tbl)\n    assert r is nothing\ntest decode_empty_table_nonempty_bits_fails:\n    define list tbl as empty List<CodeEntry>\n    define r: Optional<String> as decode_bits(\"0\", tbl)\n    assert r is nothing\ntest decode_unknown_byte_rejected:\n    define list tbl as [CodeEntry(ch=200, code=\"0\")]\n    define r: Optional<String> as decode_bits(\"0\", tbl)\n    assert r is nothing\ntest decode_duplicate_codes_rejected:\n    define list tbl as [CodeEntry(ch=97, code=\"0\"), CodeEntry(ch=98, code=\"0\")]\n    define r: Optional<String> as decode_bits(\"00\", tbl)\n    assert r is nothing\ntest decode_prefix_conflict_rejected:\n    define list tbl as [CodeEntry(ch=97, code=\"0\"), CodeEntry(ch=98, code=\"00\")]\n    define r: Optional<String> as decode_bits(\"00\", tbl)\n    assert r is nothing\ntest char_code_conversions:\n    define ot: Optional<Int> as byte_of_char(\"\\t\")\n    assert ot is not nothing\n    assert value of ot == 9\n    define on: Optional<Int> as byte_of_char(\"\\n\")\n    assert on is not nothing\n    assert value of on == 10\n    define ocr: Optional<Int> as byte_of_char(\"\\r\")\n    assert ocr is not nothing\n    assert value of ocr == 13\n    define oa: Optional<Int> as byte_of_char(\"a\")\n    assert oa is not nothing\n    assert value of oa == 97\n    define otile: Optional<String> as char_of_byte(126)\n    assert otile is not nothing\n    assert value of otile == \"~\"\n    define odel: Optional<String> as char_of_byte(127)\n    assert odel is nothing\n    define ohi: Optional<Int> as byte_of_char(character of 200)\n    assert ohi is nothing\ntest control_chars_roundtrip:\n    define s: String as \"\\t\\n\\rab\\r\\n\"\n    define got: Optional<List<CodeEntry>> as codes_for(s)\n    assert got is not nothing\n    define list t as value of got\n    define b: Optional<String> as encode_bits(s, t)\n    assert b is not nothing\n    define d: Optional<String> as decode_bits(value of b, t)\n    assert d is not nothing\n    assert value of d == s\ntest unsupported_char_detected:\n    define got: Optional<List<CodeEntry>> as codes_for(\"h\\u00e9llo\")\n    assert got is nothing",
